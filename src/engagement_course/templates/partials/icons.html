{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
	{%- if name == 'calendar' -%}
		<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
	{%- elif name == 'flag' -%}
		<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>
	{%- elif name == 'check' -%}
		<path d="M20 6 9 17l-5-5"/>
	{%- elif name == 'check-circle' -%}
		<circle cx="12" cy="12" r="9.5"/><path d="m8 12 3 3 5-6"/>
	{%- elif name == 'x' -%}
		<path d="M18 6 6 18M6 6l12 12"/>
	{%- elif name == 'user' -%}
		<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
	{%- elif name == 'users' -%}
		<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>
	{%- elif name == 'logout' -%}
		<path d="M14 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-3M10 12h11m-3-4 4 4-4 4"/>
	{%- elif name == 'pin' -%}
		<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>
	{%- elif name == 'route' -%}
		<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H17a3.5 3.5 0 0 0 0-7H7a3.5 3.5 0 0 1 0-7h8.5"/>
	{%- elif name == 'bike' -%}
		<circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M5.5 17 9 9h6l3.5 8M9 9 12 17h6.5M14 5h2.5l-1.5 4"/>
	{%- elif name == 'filter' -%}
		<path d="M3 5h18M6 12h12M10 19h4"/>
	{%- elif name == 'chevron-left' -%}
		<path d="m15 6-6 6 6 6"/>
	{%- elif name == 'chevron-right' -%}
		<path d="m9 6 6 6-6 6"/>
	{%- elif name == 'clock' -%}
		<circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3 2"/>
	{%- elif name == 'star' -%}
		<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9Z"/>
	{%- elif name == 'shield' -%}
		<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6Z"/><path d="m9 12 2 2 4-4"/>
	{%- elif name == 'copy' -%}
		<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
	{%- elif name == 'plus' -%}
		<path d="M12 5v14M5 12h14"/>
	{%- elif name == 'search' -%}
		<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
	{%- endif -%}
</svg>
{%- endmacro %}
