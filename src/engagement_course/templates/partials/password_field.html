{# Password input with an "Afficher" button: typing blind on a phone is the first cause of failed logins #}
<div class="password-wrap">
	{{ field(id=field_id, type="password", required=required, autocomplete=autocomplete) }}
	<button type="button" class="password-toggle" data-toggle-password="{{ field_id }}">Afficher</button>
</div>
