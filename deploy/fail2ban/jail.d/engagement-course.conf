# Caddy runs in Docker: published ports bypass the INPUT chain,
# so bans go into DOCKER-USER (all ports, TCP and UDP for HTTP/3).
[caddy-login]
enabled  = true
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
backend  = auto
filter   = caddy-login
logpath  = /var/log/caddy/access.log
action   = iptables-allports[name=caddy-login, chain=DOCKER-USER, protocol=all]
maxretry = 10
findtime = 1m
bantime  = 1h

[caddy-scan]
enabled  = true
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
backend  = auto
filter   = caddy-scan
logpath  = /var/log/caddy/access.log
action   = iptables-allports[name=caddy-scan, chain=DOCKER-USER, protocol=all]
maxretry = 10
findtime = 1m
bantime  = 1d
