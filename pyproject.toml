[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engagement-course"
version = "0.1.0"
description = "Club course registration app with FFC calendar parsing"
authors = [{name = "ASPTT"}]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "flask>=3.0.0",
    "python-dotenv",
    "bcrypt",
    "flask-login",
    "flask-wtf>=1.2.2",
    "pydantic>=2.12.5",
    "gunicorn>=21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
engagement_course = [
    "templates/*.html",
    "templates/partials/*.html",
    "assets/*.css",
    "assets/*.png",
    "assets/*.jpg",
    "assets/*.jpeg",
    "assets/*.webp",
    "assets/*.svg",
]
