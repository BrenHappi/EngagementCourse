# Usage:
#   prod : docker compose --profile prod up -d           (image built by CI, see DEPLOY.md)
#   dev  : docker compose --profile dev up --build    -> http://localhost:8000

x-app-environment: &app-environment
  FLASK_APP: ${FLASK_APP}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  SECRET_KEY: ${SECRET_KEY}
  EXTERNAL_URL: ${EXTERNAL_URL}
  SMTP_HOSTNAME: ${SMTP_HOSTNAME}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USERNAME: ${SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

services:
  app:
    profiles: [prod]
    # Built and pushed to GHCR by .github/workflows/deploy.yml.
    # APP_TAG=<commit sha> in .env pins or rolls back to an older build.
    image: ghcr.io/brenhappi/engagementcourse:${APP_TAG:-latest}
    # Kept so the image can still be rebuilt locally with --build
    build: .
    volumes:
      - ./data:/app/data
    environment: *app-environment
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  server:
    profiles: [prod]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Access log on the host, for fail2ban
      - /var/log/caddy:/var/log/caddy
      # Certificates must persist, otherwise each restart asks Let's Encrypt again (rate limited)
      - caddy_data:/data
      - caddy_config:/config

  # Flask dev server with debugger and auto-reload: never expose publicly
  app-dev:
    profiles: [dev]
    build: .
    command: ["python3", "main.py", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app/
    environment:
      <<: *app-environment
      EXTERNAL_URL: http://localhost:8000

volumes:
  caddy_data:
  caddy_config:
