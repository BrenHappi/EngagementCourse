[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engagement-course"
version = "0.1.0"
description = "Club course registration app with FFC calendar parsing"
authors = [{name = "ASPTT"}]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "flask>=3.0.0",
    "python-dotenv",
    "bcrypt",
    "flask-login",
    "flask-wtf>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}
