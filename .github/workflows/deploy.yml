# Tests, image build and deployment on every push to main (see DEPLOY.md).
# The image is built here, not on the server: a 512 MB droplet needs swap to
# build it, and the layer cache makes the build a few seconds most of the time.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time: queue pushes instead of racing on the :latest tag.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brenhappi/engagementcourse

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest is what the server deploys, :<sha> is kept for rollbacks
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the GHCR package to the repository, so it inherits its permissions
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The DEPLOY_* secrets are environment secrets: a job only gets them by naming it
    environment: ci-cd
    steps:
      - name: Run the deploy script on the server
        # Connects as the user that owns the checkout, not root: the repository
        # and the Git deploy key belong to them, and they are in the docker group.
        # The key is restricted to scripts/deploy.sh by a forced command in
        # authorized_keys, so the command sent here is ignored.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "debian@$DEPLOY_HOST" deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
